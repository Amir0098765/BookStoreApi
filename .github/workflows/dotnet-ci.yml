
name: .NET CI

on:
  push:
    branches:
      - feature/product-pr

  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./BookStoreApi.Tests/BookStoreApi.Tests.csproj

      - name: Build
        run: dotnet build ./BookStoreApi.Tests/BookStoreApi.Tests.csproj --no-restore

      - name: Test
        run: dotnet test ./BookStoreApi.Tests/BookStoreApi.Tests.csproj --no-build --no-restore
